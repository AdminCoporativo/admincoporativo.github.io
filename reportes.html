<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Gerencial</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<!-- Barra de navegación simple o botón para volver al dashboard -->
<div class="top-bar" style="display: flex; justify-content: space-between; padding: 10px; background: #f8f9fa;">
    <span id="userName">Cargando usuario...</span>
    <a href="dashboard.html" style="text-decoration: none; color: #3b82f6; font-weight: bold;">⬅ Volver al Dashboard</a>
</div>

<div class="main">
    <div class="header-datos" style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div>
            <label>Reporte realizado por:</label><br>
            <input type="text" id="reportePersona" placeholder="Nombre del responsable" style="width: 250px; padding: 5px;">
        </div>
        <div>
            <label>Fecha del reporte:</label><br>
            <input type="date" id="reporteFecha" style="padding: 5px;">
        </div>
    </div>

    <h2>Reporte Gerencial</h2>

    <div class="tabla-container">
        <table id="tabla">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>✔</th>
                    <th>Tareas</th>
                    <th>%</th>
                    <th>Progreso</th>
                    <th>Días</th>
                    <th>F.Inicial</th>
                    <th>F.Final</th>
                    <th>Observaciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="acciones" style="margin-top: 20px;">
        <button id="btnAgregar">➕ Agregar</button>
        <button id="btnTitulo">📁 Agregar Título</button> 
        <button id="btnEliminar">🗑 Eliminar</button>
        <button id="btnSeleccionarTodo">☑ Seleccionar todo</button>
        <button id="btnBloquear">🔓 Bloquear Tareas</button>
        <button id="btnDuplicar">🗐 Duplicar</button>
        <button id="btnPDF">📄 PDF</button>
    </div>
</div>

<!-- Scripts necesarios -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<!-- auth-guard.js se encarga de proteger la ruta si no hay sesión -->
<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
