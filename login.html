<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Administrativo - Acceso</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e293b; /* Color del sidebar para consistencia */
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-bottom: 25px; color: #1e293b; }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .btn-secondary {
            background: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }
        .btn-google {
            background: #f1f5f9;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .mensaje { color: #ef4444; font-size: 14px; margin-top: 10px; }
        .link { margin-top: 15px; font-size: 13px; }
        .link a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 Sistema Administrativo</h2>
        
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">

        <button id="btnLogin" class="btn-login">Ingresar</button>
        <button id="btnRegister" class="btn-login btn-secondary">Crear cuenta</button>

        <button id="btnGoogle" class="btn-login btn-google">
            <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" width="18">
            Continuar con Google
        </button>

        <p class="link">
            <a href="#" id="btnReset">¿Olvidaste tu contraseña?</a>
        </p>

        <p id="mensaje" class="mensaje"></p>
    </div>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/login-logic.js"></script>
    
</body>
</html>
